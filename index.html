<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1 Min Workout</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px;
    padding: 14px 24px; font-size: 18px; font-weight: 600; }
  .primary { background: #2f80ed; color: #fff; }
  .primary:hover { background: #1c6dd8; }

  #home { height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 16px; text-align: center; }
  #home h1 { margin: 0; font-size: 36px; }
  #home p { margin: 0; color: #aaa; }

  #room { height: 100%; display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    background: #1b1b1b; flex-wrap: wrap; }
  #bar .spacer { flex: 1; }
  #bar button { padding: 8px 14px; font-size: 14px; background: #333; color: #eee; }
  #status { color: #aaa; font-size: 14px; }
  #toast { color: #6fcf97; font-size: 14px; }

  #grid { flex: 1; display: grid; gap: 6px; padding: 6px; min-height: 0; }
  .tile { position: relative; background: #000; border-radius: 10px; overflow: hidden; min-height: 0; }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.self video { transform: scaleX(-1); }
  .tile .label { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.6);
    padding: 4px 10px; border-radius: 6px; font-size: 14px; }
  .tile .ready-btn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: #444; color: #fff; }
  .tile .ready-btn.on, .tile .ready-badge.on { background: #27ae60; }
  .tile .ready-badge { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: #444; padding: 10px 18px; border-radius: 10px; font-weight: 600; }

  #countdown { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; font-size: min(40vw, 40vh); font-weight: 800; color: rgba(255,255,255,.9);
    text-shadow: 0 0 30px rgba(0,0,0,.8); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div id="home" hidden>
  <h1>1 Min Workout</h1>
  <p>Create a room, share the link, get ready, go.</p>
  <button id="create" class="primary">Create room link</button>
</div>

<div id="room" hidden>
  <div id="bar">
    <strong>1 Min Workout</strong>
    <span id="status">Connecting…</span>
    <span class="spacer"></span>
    <span id="toast"></span>
    <button id="copy">Copy link</button>
  </div>
  <div id="grid"></div>
</div>

<div id="countdown" hidden></div>

<script type="module">
import { joinRoom, selfId } from 'https://esm.run/trystero@0.25.4'

const $ = id => document.getElementById(id)
const params = new URLSearchParams(location.search)
const roomId = params.get('room')
const COUNT_FROM = 90

// ---------- Home: generate a unique room link ----------
if (!roomId) {
  $('home').hidden = false
  $('create').onclick = async () => {
    const id = crypto.randomUUID().replace(/-/g, '').slice(0, 10)
    const url = new URL(location.href)
    url.search = '?room=' + id
    await copyText(url.href)
    location.href = url.href
  }
} else {
  startRoom(roomId)
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true }
  catch {
    const ta = document.createElement('textarea')
    ta.value = text; document.body.appendChild(ta); ta.select()
    const ok = document.execCommand('copy'); ta.remove(); return ok
  }
}

function toast(msg) {
  $('toast').textContent = msg
  clearTimeout(toast.t)
  toast.t = setTimeout(() => ($('toast').textContent = ''), 2500)
}

// ---------- Room ----------
async function startRoom(roomId) {
  $('room').hidden = false
  $('copy').onclick = async () => { await copyText(location.href); toast('Link copied!') }

  const grid = $('grid')
  const tiles = new Map()   // peerId -> {el, video, badge}
  const ready = new Map()   // peerId -> bool (includes self)
  let counting = false
  let timer = null

  let localStream = null
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true })
  } catch (e) {
    $('status').textContent = 'Camera/mic unavailable: ' + e.message
  }

  // Self tile
  const self = makeTile(selfId, 'You', true)
  if (localStream) { self.video.srcObject = localStream; self.video.muted = true }
  ready.set(selfId, false)

  const room = joinRoom({ appId: 'chap-1-min-workout' }, roomId)
  const readyAction = room.makeAction('ready')

  if (localStream) room.addStream(localStream)

  room.onPeerJoin = peerId => {
    if (localStream) room.addStream(localStream, { target: peerId })
    ensurePeer(peerId)
    readyAction.send(ready.get(selfId), { target: peerId })
    update()
  }

  room.onPeerLeave = peerId => {
    tiles.get(peerId)?.el.remove()
    tiles.delete(peerId)
    ready.delete(peerId)
    update()
  }

  room.onPeerStream = (stream, peerId) => {
    ensurePeer(peerId).video.srcObject = stream
    update()
  }

  function ensurePeer(peerId) {
    if (!tiles.has(peerId)) {
      makeTile(peerId, 'Guest ' + peerId.slice(0, 4), false)
      ready.set(peerId, false)
    }
    return tiles.get(peerId)
  }

  readyAction.onMessage = (value, { peerId }) => {
    ensurePeer(peerId)
    ready.set(peerId, !!value)
    update()
  }

  function makeTile(peerId, label, isSelf) {
    const el = document.createElement('div')
    el.className = 'tile' + (isSelf ? ' self' : '')
    const video = document.createElement('video')
    video.autoplay = true
    video.playsInline = true
    const lab = document.createElement('div')
    lab.className = 'label'
    lab.textContent = label
    el.append(video, lab)

    let badge
    if (isSelf) {
      badge = document.createElement('button')
      badge.className = 'ready-btn'
      badge.onclick = () => {
        if (counting) return
        unlockSpeech()
        ready.set(selfId, !ready.get(selfId))
        readyAction.send(ready.get(selfId))
        update()
      }
    } else {
      badge = document.createElement('div')
      badge.className = 'ready-badge'
    }
    el.append(badge)
    grid.append(el)
    const t = { el, video, badge }
    tiles.set(peerId, t)
    layout()
    return t
  }

  function layout() {
    const n = tiles.size
    const landscape = grid.clientWidth >= grid.clientHeight
    let cols = Math.ceil(Math.sqrt(n))
    let rows = Math.ceil(n / cols)
    if (!landscape) [cols, rows] = [rows, cols]
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`
    grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`
  }
  addEventListener('resize', layout)

  function update() {
    layout()
    for (const [id, t] of tiles) {
      const r = ready.get(id)
      t.badge.classList.toggle('on', !!r)
      t.badge.textContent = id === selfId
        ? (r ? 'Ready ✓ (tap to undo)' : "I'm ready")
        : (r ? 'Ready ✓' : 'Not ready')
      t.badge.hidden = counting
    }
    const total = ready.size
    const numReady = [...ready.values()].filter(Boolean).length
    $('status').textContent = total === 1
      ? 'Waiting for others to join — share the link'
      : `${total} participants · ${numReady} ready`

    if (!counting && total > 0 && numReady === total) startCountdown()
  }

  function startCountdown() {
    counting = true
    const cd = $('countdown')
    cd.hidden = false
    const start = performance.now()
    let last = null
    const tick = () => {
      const remaining = Math.max(0, COUNT_FROM - Math.floor((performance.now() - start) / 1000))
      if (remaining !== last) {
        last = remaining
        cd.textContent = remaining
        if (remaining % 5 === 0) speak(String(remaining))
      }
      if (remaining === 0) {
        clearInterval(timer)
        setTimeout(finish, 1500)
      }
    }
    tick()
    timer = setInterval(tick, 100)
    update()
  }

  function finish() {
    counting = false
    $('countdown').hidden = true
    for (const id of ready.keys()) ready.set(id, false)
    update()
  }

  update()
}

// ---------- Speech ----------
function unlockSpeech() {
  // iOS/Safari require speech to start from a user gesture once
  if (unlockSpeech.done || !('speechSynthesis' in window)) return
  unlockSpeech.done = true
  const u = new SpeechSynthesisUtterance(' ')
  u.volume = 0
  speechSynthesis.speak(u)
}

function speak(text) {
  if (!('speechSynthesis' in window)) return
  speechSynthesis.cancel()
  const u = new SpeechSynthesisUtterance(text)
  u.rate = 1.1
  speechSynthesis.speak(u)
}
</script>
</body>
</html>

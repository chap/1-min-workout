<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1 Min Workout</title>
<meta name="description" content="Join my workout — get ready, then crush it together.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="1 Min Workout">
<meta property="og:title" content="1 Min Workout">
<meta property="og:description" content="Join my workout — get ready, then crush it together.">
<meta property="og:url" content="https://chap.github.io/1-min-workout/">
<meta property="og:image" content="https://chap.github.io/1-min-workout/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="60">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://chap.github.io/1-min-workout/og.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root { --black: #000; --white: #fff; --yellow: #ffd60a; }
  html, body { margin: 0; height: 100%; background: var(--black); color: var(--white);
    font-family: "Courier New", Courier, monospace; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px;
    padding: 14px 24px; font-size: 18px; font-weight: 600; }
  .primary { background: var(--yellow); color: var(--black); }
  .primary:hover { background: var(--white); }

  #home { height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 16px; text-align: center; }
  #home h1 { margin: 0; font-size: 36px; }
  #home h1 { color: var(--yellow); }
  #home p { margin: 0; color: var(--white); }

  #room { height: 100%; display: flex; flex-direction: column; }

  #grid { flex: 1; display: grid; gap: 6px; padding: 6px; min-height: 0; }
  .tile { position: relative; background: #111; border-radius: 10px; overflow: hidden; min-height: 0; }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.self video { transform: scaleX(-1); }
  .tile .ready-btn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: var(--black); color: var(--white); border: 2px solid var(--white); white-space: nowrap; }
  .tile .ready-badge { position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.7); color: var(--white); text-align: center;
    padding: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .tile .ready-btn.small { padding: 6px 12px; font-size: 14px; border-width: 1px; }
  .tile .ready-badge.small { padding: 6px; font-size: 14px; }
  .tile .ready-btn.on, .tile .ready-badge.on { background: var(--yellow); color: var(--black); border-color: var(--yellow); }

  #copy { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; align-items: center; gap: 10px; padding: 12px 22px; font-size: 18px;
    background: var(--black); color: var(--yellow); border: 2px solid var(--yellow); border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4); white-space: nowrap; transition: background .2s; }
  #copy:hover { background: var(--yellow); color: var(--black); }
  #copy.copied { background: var(--yellow); color: var(--black); }
  #copy svg { width: 22px; height: 22px; flex: none; }

  #copied-banner { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20;
    background: var(--yellow); color: var(--black); padding: 22px 30px; border-radius: 16px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); max-width: calc(100vw - 32px);
    animation: pop .25s ease-out; transition: opacity .4s; }
  #copied-banner strong { display: block; font-size: 26px; margin-bottom: 6px; }
  #copied-banner span { font-size: 16px; opacity: .9; }
  #copied-banner.fade { opacity: 0; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.8); opacity: 0; } }

  #countdown { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; font-size: min(40vw, 40vh); font-weight: 700; color: var(--yellow);
    text-shadow: 0 0 30px #000, 0 0 8px #000; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div id="home" hidden>
  <h1>1 Min Workout</h1>
  <p>Create a room, share the link, get ready, go.</p>
  <button id="create" class="primary">Create room link</button>
</div>

<div id="room" hidden>
  <div id="grid"></div>
  <button id="copy"></button>
  <div id="copied-banner" hidden><strong>✓ Link copied!</strong><span>Paste it in a message to invite friends</span></div>
</div>

<div id="countdown" hidden></div>

<script type="module">
import { joinRoom, selfId } from 'https://esm.run/trystero@0.25.4'
import confetti from 'https://esm.run/canvas-confetti@1.9.3'

const $ = id => document.getElementById(id)
const params = new URLSearchParams(location.search)
const roomId = params.get('room')
const COUNT_FROM = 90

// ---------- Home: generate a unique room link ----------
if (!roomId) {
  $('home').hidden = false
  $('create').onclick = async () => {
    const id = crypto.randomUUID().replace(/-/g, '').slice(0, 10)
    const url = new URL(location.href)
    url.search = '?room=' + id
    await copyText(url.href)
    history.pushState(null, '', url.href)
    $('home').hidden = true
    scrollTo(0, 0)
    startRoom(id, true)
  }
  addEventListener('popstate', () => location.reload())
} else {
  startRoom(roomId)
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true }
  catch {
    const ta = document.createElement('textarea')
    ta.value = text; document.body.appendChild(ta); ta.select()
    const ok = document.execCommand('copy'); ta.remove(); return ok
  }
}

// ---------- Room ----------
async function startRoom(roomId, justCreated = false) {
  $('room').hidden = false
  if (justCreated) {
    const banner = $('copied-banner')
    banner.hidden = false
    setTimeout(() => banner.classList.add('fade'), 3500)
    setTimeout(() => (banner.hidden = true), 4000)
  }
  const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
  const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
  const setCopy = (copied) => {
    $('copy').innerHTML = copied ? checkIcon + 'Copied!' : copyIcon + 'Copy link'
    $('copy').classList.toggle('copied', copied)
  }
  setCopy(justCreated)
  if (justCreated) copyText.t = setTimeout(() => setCopy(false), 4000)
  $('copy').onclick = async () => {
    await copyText(location.href)
    setCopy(true)
    clearTimeout(copyText.t)
    copyText.t = setTimeout(() => setCopy(false), 2000)
  }

  const grid = $('grid')
  const tiles = new Map()   // peerId -> {el, video, badge}
  const ready = new Map()   // peerId -> bool (includes self)
  let counting = false
  let timer = null

  let localStream = null
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true })
  } catch (e) {
    console.warn('Camera/mic unavailable', e)
  }

  // Self tile
  const self = makeTile(selfId, true)
  if (localStream) { self.video.srcObject = localStream; self.video.muted = true }
  ready.set(selfId, false)

  const room = joinRoom({ appId: 'chap-1-min-workout' }, roomId)
  const resetVotes = new Set()   // peerIds (incl. self) who want to reset the countdown
  let countdownPeers = new Set() // participants when the countdown started

  // Not every pair of browsers can connect directly (NAT/firewalls), so state is
  // gossiped through the mesh and video is relayed by a peer that can reach both.
  const directPeers = new Set()   // peers with a direct WebRTC connection
  const streams = new Map()       // origin -> {stream, via}
  const lastSeen = new Map()      // origin -> ms of last message
  const knownDirect = new Map()   // origin -> Set of peers it has direct video from
  const relayAsked = new Map()    // origin -> {via, at}
  const seen = new Set()
  let seq = 0

  const msgAction = room.makeAction('msg')
  const relayAction = room.makeAction('relay')

  function flood(env, except) {
    const targets = [...directPeers].filter(id => id !== except && id !== env.origin)
    if (targets.length) msgAction.send(env, { target: targets })
  }
  function broadcast(type, data) {
    const env = { origin: selfId, seq: ++seq, type, data }
    seen.add(selfId + ':' + env.seq)
    flood(env)
  }
  const sendHello = () => broadcast('hello', [...streams].filter(([id, s]) => s.via === id).map(([id]) => id))
  const sendState = () => {
    broadcast('ready', ready.get(selfId))
    if (counting) broadcast('reset', resetVotes.has(selfId))
  }

  msgAction.onMessage = (env, { peerId }) => {
    const key = env.origin + ':' + env.seq
    if (env.origin === selfId || seen.has(key)) return
    seen.add(key)
    if (seen.size > 5000) seen.clear()
    flood(env, peerId)

    if (env.type === 'bye') return removePeer(env.origin)
    lastSeen.set(env.origin, Date.now())
    ensurePeer(env.origin)
    if (env.type === 'hello') knownDirect.set(env.origin, new Set(env.data))
    if (env.type === 'ready') ready.set(env.origin, !!env.data)
    if (env.type === 'reset' && counting) env.data ? resetVotes.add(env.origin) : resetVotes.delete(env.origin)
    update()
  }

  relayAction.onMessage = ({ origin }, { peerId }) => {
    const s = streams.get(origin)
    if (s && s.via === origin) room.addStream(s.stream, { target: peerId, metadata: { origin } })
  }

  if (localStream) room.addStream(localStream)

  room.onPeerJoin = peerId => {
    directPeers.add(peerId)
    lastSeen.set(peerId, Date.now())
    if (localStream) room.addStream(localStream, { target: peerId })
    ensurePeer(peerId)
    sendHello()
    sendState()
    update()
  }

  room.onPeerLeave = peerId => {
    directPeers.delete(peerId)
    for (const [origin, s] of streams) {
      if (s.via === peerId) { streams.delete(origin); relayAsked.delete(origin) }
    }
    // Keep the tile if they're still reachable through someone else; the
    // housekeeping loop removes them once their heartbeats stop.
    if (Date.now() - (lastSeen.get(peerId) || 0) > 5000) removePeer(peerId)
    sendHello()
  }

  room.onPeerStream = (stream, peerId, metadata) => {
    const origin = metadata?.origin || peerId
    if (origin === selfId) return
    const existing = streams.get(origin)
    if (origin !== peerId && existing?.via === origin) return // prefer direct video
    streams.set(origin, { stream, via: peerId })
    ensurePeer(origin).video.srcObject = stream
    if (origin === peerId) sendHello()
    update()
  }

  function ensurePeer(peerId) {
    if (!tiles.has(peerId)) {
      makeTile(peerId, false)
      ready.set(peerId, false)
      lastSeen.set(peerId, lastSeen.get(peerId) || Date.now())
      sendState()
    }
    return tiles.get(peerId)
  }

  function removePeer(peerId) {
    if (!tiles.has(peerId)) return
    tiles.get(peerId).el.remove()
    tiles.delete(peerId)
    ready.delete(peerId)
    resetVotes.delete(peerId)
    countdownPeers.delete(peerId)
    streams.delete(peerId)
    lastSeen.delete(peerId)
    knownDirect.delete(peerId)
    relayAsked.delete(peerId)
    update()
  }

  // Heartbeat, stale-peer cleanup, and asking for relayed video when needed.
  setInterval(() => {
    const now = Date.now()
    sendHello()
    for (const id of [...tiles.keys()]) {
      if (id === selfId) continue
      if (!directPeers.has(id) && now - (lastSeen.get(id) || 0) > 8000) { removePeer(id); continue }
      if (streams.has(id)) continue
      const asked = relayAsked.get(id)
      if (asked && now - asked.at < 5000) continue
      const via = [...directPeers].find(p => knownDirect.get(p)?.has(id))
      if (via) {
        relayAsked.set(id, { via, at: now })
        relayAction.send({ origin: id }, { target: via })
      }
    }
  }, 2000)

  addEventListener('pagehide', () => broadcast('bye'))

  function makeTile(peerId, isSelf) {
    const el = document.createElement('div')
    el.className = 'tile' + (isSelf ? ' self' : '')
    const video = document.createElement('video')
    video.autoplay = true
    video.playsInline = true
    el.append(video)

    let badge
    if (isSelf) {
      badge = document.createElement('button')
      badge.className = 'ready-btn'
      badge.onclick = () => {
        if (counting) {
          const vote = !resetVotes.has(selfId)
          vote ? resetVotes.add(selfId) : resetVotes.delete(selfId)
          broadcast('reset', vote)
          update()
          return
        }
        unlockSpeech()
        ready.set(selfId, !ready.get(selfId))
        broadcast('ready', ready.get(selfId))
        update()
      }
    } else {
      badge = document.createElement('div')
      badge.className = 'ready-badge'
    }
    el.append(badge)
    grid.append(el)
    const t = { el, video, badge }
    tiles.set(peerId, t)
    layout()
    return t
  }

  function layout() {
    const n = tiles.size
    const landscape = grid.clientWidth >= grid.clientHeight
    let cols = Math.ceil(Math.sqrt(n))
    let rows = Math.ceil(n / cols)
    if (!landscape) [cols, rows] = [rows, cols]
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`
    grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`
  }
  addEventListener('resize', layout)

  function update() {
    layout()
    for (const [id, t] of tiles) {
      const isSelf = id === selfId
      t.badge.classList.toggle('small', counting)
      if (counting) {
        const voted = resetVotes.has(id)
        t.badge.classList.toggle('on', voted)
        t.badge.textContent = isSelf ? (voted ? 'Reset ✓' : 'Reset') : 'Reset ✓'
        t.badge.hidden = !isSelf && !voted
      } else {
        const r = ready.get(id)
        t.badge.classList.toggle('on', !!r)
        t.badge.textContent = isSelf
          ? (r ? 'Ready ✓ (tap to undo)' : "I'm ready")
          : (r ? 'Ready ✓' : 'Not ready')
        t.badge.hidden = false
      }
    }
    if (counting && countdownPeers.size && [...countdownPeers].every(id => resetVotes.has(id))) {
      clearInterval(timer)
      window.speechSynthesis?.cancel()
      finish()
      return
    }
    const total = ready.size
    const numReady = [...ready.values()].filter(Boolean).length

    if (!counting && total > 0 && numReady === total) startCountdown()
  }

  function startCountdown() {
    counting = true
    resetVotes.clear()
    countdownPeers = new Set(ready.keys())
    const cd = $('countdown')
    cd.hidden = false
    const start = performance.now()
    let last = null
    const tick = () => {
      const remaining = Math.max(0, COUNT_FROM - Math.floor((performance.now() - start) / 1000))
      if (remaining !== last) {
        last = remaining
        cd.textContent = remaining
        if (remaining % 5 === 0 || remaining <= 10) speak(String(remaining))
      }
      if (remaining === 0) {
        clearInterval(timer)
        celebrate()
        setTimeout(finish, 1500)
      }
    }
    tick()
    timer = setInterval(tick, 100)
    update()
  }

  function finish() {
    counting = false
    resetVotes.clear()
    countdownPeers.clear()
    $('countdown').hidden = true
    for (const id of ready.keys()) ready.set(id, false)
    update()
  }

  update()
}

// ---------- Confetti ----------
function celebrate() {
  const end = Date.now() + 3000
  const colors = ['#ffd60a', '#ffffff', '#000000']
  confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 }, colors })
  ;(function frame() {
    confetti({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0 }, colors })
    confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1 }, colors })
    if (Date.now() < end) requestAnimationFrame(frame)
  })()
}

// ---------- Speech ----------
function unlockSpeech() {
  // iOS/Safari require speech to start from a user gesture once
  if (unlockSpeech.done || !('speechSynthesis' in window)) return
  unlockSpeech.done = true
  const u = new SpeechSynthesisUtterance(' ')
  u.volume = 0
  speechSynthesis.speak(u)
}

function speak(text) {
  if (!('speechSynthesis' in window)) return
  speechSynthesis.cancel()
  const u = new SpeechSynthesisUtterance(text)
  u.rate = 1.1
  speechSynthesis.speak(u)
}
</script>
</body>
</html>
